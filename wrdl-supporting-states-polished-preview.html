  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;

}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));

  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);

.form-switch .form-check-input:checked {
  background: var(--primary);

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;

      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {

    min-height: 44px;

  }

    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;

  ) {

  }

    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;

  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

  height: auto;

  &lt;div class=&quot;wrdl-stage&quot; id=&quot;wrdl-supporting-stage&quot;&gt;
    &lt;div class=&quot;wrdl-app&quot; data-app aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
  &lt;/div&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wrdl-supporting-states-polished&#x27;);
      const stage = root.querySelector(&#x27;#wrdl-supporting-stage&#x27;);
      const app = root.querySelector(&#x27;[data-app]&#x27;);
      let screen = &#x27;confirm&#x27;;
      let confirmation = &#x27;free&#x27;;
      let errorType = &#x27;standard&#x27;;
      let invitesOpen = true;
      let inviteCount = 2;
      let viewport = &#x27;desktop&#x27;;
      let drawerOpen = true;

      const logo = () =&gt; &#x27;&lt;div class=&quot;wrdl-logo&quot; aria-label=&quot;WRDL&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;R&lt;/span&gt;&lt;span&gt;D&lt;/span&gt;&lt;span&gt;L&lt;/span&gt;&lt;/div&gt;&#x27;;
      const icon = name =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;
      const account = () =&gt; `&lt;div class=&quot;wrdl-account&quot;&gt;&lt;span class=&quot;wrdl-avatar&quot; aria-hidden=&quot;true&quot;&gt;${icon(&#x27;user&#x27;)}&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Yuri&lt;/strong&gt;&lt;span&gt;@yuri&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`;
      const nav = active =&gt; `&lt;nav class=&quot;wrdl-nav&quot; aria-label=&quot;Main navigation&quot;&gt;
        &lt;button class=&quot;wrdl-nav-item ${active === &#x27;Home&#x27; ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot;&gt;${icon(&#x27;house&#x27;)}&lt;span class=&quot;wrdl-nav-label&quot;&gt;Home&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-nav-item ${active === &#x27;Profile&#x27; ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot;&gt;${icon(&#x27;user&#x27;)}&lt;span class=&quot;wrdl-nav-label&quot;&gt;Profile&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-nav-item ${active === &#x27;Friends&#x27; ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot;&gt;${icon(&#x27;users&#x27;)}&lt;span class=&quot;wrdl-nav-label&quot;&gt;Friends&lt;/span&gt;&lt;span class=&quot;wrdl-count&quot;&gt;3&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-nav-item ${active === &#x27;Settings&#x27; ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot;&gt;${icon(&#x27;settings&#x27;)}&lt;span class=&quot;wrdl-nav-label&quot;&gt;Settings&lt;/span&gt;&lt;/button&gt;
      &lt;/nav&gt;`;
      const header = (title, offline = false) =&gt; `&lt;header class=&quot;wrdl-header&quot;&gt;${logo()}&lt;div class=&quot;wrdl-page-name&quot;&gt;${title}&lt;/div&gt;&lt;button class=&quot;wrdl-menu-button&quot; type=&quot;button&quot; aria-label=&quot;Open menu&quot;&gt;${icon(&#x27;menu&#x27;)}&lt;/button&gt;&lt;/header&gt;${offline ? `&lt;div class=&quot;wrdl-offline-banner&quot; role=&quot;status&quot;&gt;${icon(&#x27;wifi-off&#x27;)}&lt;span&gt;You&#x27;re offline&lt;/span&gt;&lt;/div&gt;` : &#x27;&#x27;}`;
      const sidebar = active =&gt; `&lt;aside class=&quot;wrdl-sidebar&quot;&gt;${account()}${nav(active)}&lt;/aside&gt;`;
      const homeCards = (offline = false) =&gt; `&lt;div class=&quot;wrdl-content&quot;&gt;&lt;h1&gt;Choose a game&lt;/h1&gt;&lt;p&gt;Welcome back, Yuri.&lt;/p&gt;&lt;div class=&quot;wrdl-home-grid&quot;&gt;
        &lt;button class=&quot;wrdl-home-card daily ${offline ? &#x27;wrdl-offline-card&#x27; : &#x27;&#x27;}&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;wrdl-mode-copy&quot;&gt;&lt;strong&gt;Daily Wordle&lt;/strong&gt;&lt;span class=&quot;wrdl-mode-detail&quot;&gt;${offline ? &#x27;Connection required&#x27; : &#x27;Next puzzle 08:42:16&#x27;}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;wrdl-mode-art wrdl-daily-art&quot; aria-hidden=&quot;true&quot;&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-yellow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-yellow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-gray&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-yellow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-yellow&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;span class=&quot;is-green&quot;&gt;&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-home-card free&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;wrdl-mode-copy&quot;&gt;&lt;strong&gt;Free Play&lt;/strong&gt;&lt;span class=&quot;wrdl-mode-detail&quot;&gt;Practice freely.&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;wrdl-mode-art wrdl-free-art&quot; aria-hidden=&quot;true&quot;&gt;&lt;span&gt;W&lt;/span&gt;&lt;span&gt;R&lt;/span&gt;&lt;span&gt;D&lt;/span&gt;&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-home-card battle&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;wrdl-mode-copy&quot;&gt;&lt;strong&gt;Friendly Battle&lt;/strong&gt;&lt;span class=&quot;wrdl-mode-detail&quot;&gt;Play with friends.&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;wrdl-mode-art wrdl-battle-art&quot; aria-hidden=&quot;true&quot;&gt;${icon(&#x27;swords&#x27;)}&lt;/span&gt;&lt;/button&gt;
        &lt;button class=&quot;wrdl-home-card leaderboard&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;wrdl-mode-copy&quot;&gt;&lt;strong&gt;Leaderboards&lt;/strong&gt;&lt;span class=&quot;wrdl-mode-detail&quot;&gt;See the rankings.&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;wrdl-mode-art wrdl-leader-art&quot; aria-hidden=&quot;true&quot;&gt;${icon(&#x27;trophy&#x27;)}&lt;/span&gt;&lt;/button&gt;
      &lt;/div&gt;&lt;/div&gt;`;
      const shell = (main, active = &#x27;Home&#x27;, options = {}) =&gt; `&lt;div class=&quot;wrdl-shell&quot;&gt;&lt;main class=&quot;wrdl-main&quot;&gt;${header(options.title || active, options.offline)}${main}&lt;/main&gt;${sidebar(active)}&lt;/div&gt;`;

      function invitationMarkup() {
        const cards = inviteCount ? `&lt;div class=&quot;wrdl-invite-stack&quot;&gt;
          ${inviteCount &gt; 1 ? `&lt;article class=&quot;wrdl-invite-card&quot;&gt;&lt;div class=&quot;wrdl-invite-person&quot;&gt;&lt;div class=&quot;wrdl-avatar&quot; aria-hidden=&quot;true&quot;&gt;M&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Mika invited you&lt;/strong&gt;&lt;span&gt;@mika · 3 players in lobby&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wrdl-invite-actions&quot;&gt;&lt;button class=&quot;wrdl-action is-primary&quot; type=&quot;button&quot; data-invite-action&gt;${icon(&#x27;check&#x27;)} Accept&lt;/button&gt;&lt;button class=&quot;wrdl-action&quot; type=&quot;button&quot; data-invite-action&gt;${icon(&#x27;x&#x27;)} Decline&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;` : &#x27;&#x27;}
          &lt;article class=&quot;wrdl-invite-card&quot;&gt;&lt;div class=&quot;wrdl-invite-person&quot;&gt;&lt;div class=&quot;wrdl-avatar&quot; aria-hidden=&quot;true&quot;&gt;A&lt;/div&gt;&lt;div&gt;&lt;strong&gt;Ari invited you&lt;/strong&gt;&lt;span&gt;@ari · 2 players in lobby&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wrdl-invite-actions&quot;&gt;&lt;button class=&quot;wrdl-action is-primary&quot; type=&quot;button&quot; data-invite-action&gt;${icon(&#x27;check&#x27;)} Accept&lt;/button&gt;&lt;button class=&quot;wrdl-action&quot; type=&quot;button&quot; data-invite-action&gt;${icon(&#x27;x&#x27;)} Decline&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;
        &lt;/div&gt;` : &#x27;&#x27;;
        const invitationControl = !inviteCount ? &#x27;&#x27; : invitesOpen
          ? `&lt;section class=&quot;wrdl-invite-panel&quot; aria-label=&quot;Battle invitations&quot;&gt;&lt;div class=&quot;wrdl-invite-panel-head&quot;&gt;&lt;strong&gt;Battle Invitations&lt;/strong&gt;&lt;span class=&quot;wrdl-count&quot;&gt;${inviteCount}&lt;/span&gt;&lt;button class=&quot;wrdl-icon-button&quot; type=&quot;button&quot; data-invite-bubble aria-label=&quot;Minimize battle invitations&quot;&gt;${icon(&#x27;chevron-down&#x27;)}&lt;/button&gt;&lt;/div&gt;${cards}&lt;/section&gt;`
          : `&lt;button class=&quot;wrdl-invite-bubble&quot; type=&quot;button&quot; data-invite-bubble aria-label=&quot;Open battle invitations&quot;&gt;${icon(&#x27;swords&#x27;)}&lt;span class=&quot;wrdl-bubble-count&quot;&gt;${inviteCount}&lt;/span&gt;&lt;/button&gt;`;
        return `${shell(homeCards())}&lt;div class=&quot;wrdl-invite-area&quot;&gt;${invitationControl}&lt;/div&gt;`;
      }

      function menuMarkup() {
        if (viewport === &#x27;desktop&#x27;) return shell(homeCards());
        if (!drawerOpen) return shell(homeCards());

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }

    const request = ++positionRequest;

      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),

          padding: tooltipGap,

              &quot;--tooltip-available-height&quot;,

      .then(({ x, y }) =&gt; {

  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;

    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {

  const handlePointer = (event) =&gt; {

      trigger == null ||

      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {

      }

  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {

    }

  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {

    }
  };

    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);

    }
  };

    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);

    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
