  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wrdl-active-battle-polished&#x27;);
      const stage = root.querySelector(&#x27;#wrdl-active-battle-stage&#x27;);
      const arena = root.querySelector(&#x27;[data-arena]&#x27;);
      const ownBoard = root.querySelector(&#x27;[data-own-board]&#x27;);
      const keyboard = root.querySelector(&#x27;[data-keyboard]&#x27;);
      const opponents = root.querySelector(&#x27;[data-opponents]&#x27;);
      const overlay = root.querySelector(&#x27;[data-round-overlay]&#x27;);
      const gameRows = [
        {word:&#x27;CRANE&#x27;,states:[&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;]},
        {word:&#x27;MOIST&#x27;,states:[&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;]},
        {word:&#x27;BL&#x27;,states:[&#x27;filled&#x27;,&#x27;active&#x27;]}
      ];
      const finishedRows = [
        {word:&#x27;CRANE&#x27;,states:[&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;]},
        {word:&#x27;MOIST&#x27;,states:[&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;]},
        {word:&#x27;BLEND&#x27;,states:[&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;]}
      ];
      const opponentPatterns = [
        [&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;],
        [&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;present&#x27;],
        [&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;],
        [&#x27;present&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;]
      ];
      const letters = &#x27;CRANESTOILMIGHTBLENDWOVEN&#x27;;
      let currentView = &#x27;two&#x27;;
      let countdownTimer;

      function boardMarkup(rows) {
        const cells = [];
        for (let rowIndex = 0; rowIndex &lt; 6; rowIndex += 1) {
          const row = rows[rowIndex] || {word:&#x27;&#x27;,states:[]};
          for (let column = 0; column &lt; 5; column += 1) cells.push(`&lt;span class=&quot;wrdl-tile ${row.states[column] || &#x27;&#x27;}&quot;&gt;${row.word[column] || &#x27;&#x27;}&lt;/span&gt;`);
        }
        return cells.join(&#x27;&#x27;);
      }
      function keyboardMarkup() {
        const rows = [[&#x27;Q&#x27;,&#x27;W&#x27;,&#x27;E&#x27;,&#x27;R&#x27;,&#x27;T&#x27;,&#x27;Y&#x27;,&#x27;U&#x27;,&#x27;I&#x27;,&#x27;O&#x27;,&#x27;P&#x27;],[&#x27;A&#x27;,&#x27;S&#x27;,&#x27;D&#x27;,&#x27;F&#x27;,&#x27;G&#x27;,&#x27;H&#x27;,&#x27;J&#x27;,&#x27;K&#x27;,&#x27;L&#x27;],[&#x27;ENTER&#x27;,&#x27;Z&#x27;,&#x27;X&#x27;,&#x27;C&#x27;,&#x27;V&#x27;,&#x27;B&#x27;,&#x27;N&#x27;,&#x27;M&#x27;,&#x27;⌫&#x27;]];
        const states = {E:&#x27;absent&#x27;,R:&#x27;present&#x27;,A:&#x27;absent&#x27;,C:&#x27;absent&#x27;,N:&#x27;correct&#x27;};
        return rows.map(row =&gt; `&lt;div class=&quot;wrdl-key-row&quot;&gt;${row.map(key =&gt; `&lt;button class=&quot;wrdl-key ${(key === &#x27;ENTER&#x27; || key === &#x27;⌫&#x27;) ? &#x27;wide&#x27; : &#x27;&#x27;} ${states[key] || &#x27;&#x27;}&quot; type=&quot;button&quot; aria-label=&quot;${key === &#x27;⌫&#x27; ? &#x27;Erase&#x27; : key}&quot;&gt;${key}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;);
      }
      function miniBoardMarkup(patternIndex, reveal) {
        const states = opponentPatterns[patternIndex % opponentPatterns.length];
        return Array.from({length:30}, (_,index) =&gt; `&lt;span class=&quot;wrdl-mini-tile ${states[index] || &#x27;&#x27;}&quot;&gt;${reveal &amp;&amp; states[index] ? letters[index % letters.length] : &#x27;&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;);
      }
      function statusOverlayMarkup(options) {
        const finishMarkup = `&lt;div class=&quot;wrdl-card-status is-finished&quot;&gt;&lt;strong&gt;${options.placement || &#x27;1st&#x27;}&lt;/strong&gt;&lt;span&gt;Time Taken: ${options.time || &#x27;00:42&#x27;}&lt;/span&gt;&lt;/div&gt;`;
        const disconnectMarkup = `&lt;div class=&quot;wrdl-card-status is-disconnected&quot;&gt;&lt;strong&gt;Disconnected&lt;/strong&gt;${options.disconnectTime ? `&lt;span&gt;${options.disconnectTime}&lt;/span&gt;` : &#x27;&#x27;}&lt;/div&gt;`;
        if (options.finished &amp;&amp; options.disconnected) return `&lt;div class=&quot;wrdl-card-status-stack&quot;&gt;${finishMarkup}${disconnectMarkup}&lt;/div&gt;`;
        if (options.finished) return finishMarkup;
        if (options.disconnected) return disconnectMarkup;
        return &#x27;&#x27;;
      }
      function opponentMarkup(name, rank, index, options = {}) {
        return `&lt;section class=&quot;wrdl-opponent ${options.large ? &#x27;is-large&#x27; : &#x27;&#x27;}&quot;&gt;&lt;div class=&quot;wrdl-opponent-content&quot;&gt;&lt;div class=&quot;wrdl-opponent-head&quot;&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;span&gt;#${rank}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wrdl-opponent-board-wrap&quot;&gt;&lt;div class=&quot;wrdl-mini-board&quot; role=&quot;img&quot; aria-label=&quot;${name}&#x27;s 5 by 6 Wordle board&quot;&gt;${miniBoardMarkup(index, options.reveal)}&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;${statusOverlayMarkup(options)}&lt;/section&gt;`;
      }
      function renderOpponents(view) {
        if (view === &#x27;two&#x27;) return opponentMarkup(&#x27;Mika&#x27;,1,0,{large:true});
        if (view === &#x27;two-disconnected&#x27;) return opponentMarkup(&#x27;Mika&#x27;,1,0,{large:true,disconnected:true,disconnectTime:&#x27;30s&#x27;});
        const people = [[&#x27;Mika&#x27;,1],[&#x27;Ari&#x27;,3],[&#x27;Sam&#x27;,4],[&#x27;Lee&#x27;,5],[&#x27;Nia&#x27;,6],[&#x27;Theo&#x27;,7]];
        return people.map(([name,rank],index) =&gt; {
          const options = {reveal:view === &#x27;spectating&#x27;};
          if (view === &#x27;multi&#x27; &amp;&amp; name === &#x27;Mika&#x27;) Object.assign(options,{finished:true,placement:&#x27;1st&#x27;,time:&#x27;00:42&#x27;});
          if (view === &#x27;spectating&#x27;) {
            if (name === &#x27;Mika&#x27;) Object.assign(options,{finished:true,placement:&#x27;1st&#x27;,time:&#x27;00:42&#x27;});
            if (name === &#x27;Ari&#x27;) Object.assign(options,{finished:true,placement:&#x27;3rd&#x27;,time:&#x27;01:06&#x27;});
          }
          if (view === &#x27;status&#x27;) {
            if (name === &#x27;Mika&#x27;) Object.assign(options,{finished:true,placement:&#x27;1st&#x27;,time:&#x27;00:42&#x27;});
            if (name === &#x27;Ari&#x27;) Object.assign(options,{disconnected:true});
            if (name === &#x27;Sam&#x27;) Object.assign(options,{finished:true,placement:&#x27;4th&#x27;,time:&#x27;01:18&#x27;,disconnected:true});
          }
          return opponentMarkup(name,rank,index,options);
        }).join(&#x27;&#x27;);
      }
      function runCountdown() {
        window.clearInterval(countdownTimer);
        let value = 3;
        const number = root.querySelector(&#x27;[data-countdown]&#x27;);
        number.textContent = String(value);
        countdownTimer = window.setInterval(() =&gt; {
          value -= 1;
          number.textContent = value &gt; 0 ? String(value) : &#x27;GO&#x27;;
          if (value &lt;= 0) window.clearInterval(countdownTimer);
        },760);
      }
      function render(view) {
        currentView = view;
        const spectating = view === &#x27;spectating&#x27;;
        const countdown = view === &#x27;countdown&#x27;;
        const two = view === &#x27;two&#x27; || view === &#x27;two-disconnected&#x27;;
        arena.className = `wrdl-arena ${two ? &#x27;is-two&#x27; : &#x27;&#x27;} ${spectating ? &#x27;is-spectating&#x27; : &#x27;&#x27;}`;
        ownBoard.innerHTML = boardMarkup(spectating ? finishedRows : gameRows);
        keyboard.innerHTML = spectating ? &#x27;&#x27; : keyboardMarkup();
        keyboard.hidden = spectating;
        const ownTime = root.querySelector(&#x27;[data-own-time]&#x27;);
        ownTime.hidden = !spectating;
        ownTime.textContent = &#x27;Time Taken: 00:54&#x27;;
        root.querySelector(&#x27;[data-finished-note]&#x27;).hidden = !spectating;
        opponents.innerHTML = renderOpponents(view);
        root.querySelector(&#x27;[data-round]&#x27;).textContent = &#x27;Round 2/5&#x27;;
        const timer = root.querySelector(&#x27;[data-timer]&#x27;);
        timer.textContent = view === &#x27;multi&#x27; ? &#x27;00:09&#x27; : countdown ? &#x27;03:00&#x27; : spectating || view === &#x27;status&#x27; ? &#x27;00:54&#x27; : &#x27;01:42&#x27;;
        timer.classList.toggle(&#x27;is-urgent&#x27;, view === &#x27;multi&#x27;);
        overlay.hidden = !countdown;
        if (countdown) runCountdown(); else window.clearInterval(countdownTimer);
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-selected&#x27;, button.dataset.view === view));
      }
      ownBoard.innerHTML = boardMarkup(gameRows);
      keyboard.innerHTML = keyboardMarkup();
      opponents.innerHTML = renderOpponents(&#x27;two&#x27;);
      root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; render(button.dataset.view)));
      root.querySelectorAll(&#x27;[data-viewport]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        stage.classList.toggle(&#x27;is-mobile&#x27;, button.dataset.viewport === &#x27;mobile&#x27;);
        root.querySelectorAll(&#x27;[data-viewport]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
      }));
      root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.classList.toggle(&#x27;is-dark&#x27;, button.dataset.theme === &#x27;dark&#x27;);
        root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
      }));
      root.querySelector(&#x27;[data-exit]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
        const twoPlayerView = currentView === &#x27;two&#x27; || currentView === &#x27;two-disconnected&#x27;;
        root.querySelector(&#x27;[data-dialog-copy]&#x27;).textContent = twoPlayerView ? &#x27;You have 30 seconds to rejoin before your opponent wins the battle.&#x27; : &#x27;You may rejoin while this battle remains active. If fewer than two players remain connected after the preservation period, the battle may be voided.&#x27;;
        root.querySelector(&#x27;[data-dialog]&#x27;).hidden = false;
      });
      root.querySelector(&#x27;[data-stay]&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; { root.querySelector(&#x27;[data-dialog]&#x27;).hidden = true; });
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {

  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)

    }
    if (ids.size === 0) {

    }

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
