  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)

  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);

}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {

}

.form-check:not(.form-switch) .form-check-input:focus-visible {

  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);

}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

    height: 44px;

  }

  }

  }

    height: 44px;
  }

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wordle-low-fidelity-screens&#x27;);
      const screenSelect = root.querySelector(&#x27;#wordle-wire-screen&#x27;);
      const deviceSelect = root.querySelector(&#x27;#wordle-wire-device&#x27;);
      const deviceWrap = root.querySelector(&#x27;#wordle-wire-device-wrap&#x27;);
      const stage = root.querySelector(&#x27;#wordle-wire-stage&#x27;);

      const top = (title, showMenu=true, exitLabel=&#x27;&#x27;) =&gt; {
        const inferredExit = title === &#x27;Leaderboards&#x27; ? &#x27;Exit&#x27; : title.startsWith(&#x27;Friendly Battle&#x27;) || title.startsWith(&#x27;Round Complete&#x27;) ? &#x27;Exit Battle&#x27; : &#x27;&#x27;;
        const resolvedExit = exitLabel || inferredExit;
        return showMenu
          ? `&lt;div class=&quot;wordle-wire-top&quot;&gt;&lt;span class=&quot;wordle-wire-logo&quot;&gt;WORDLE&lt;/span&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${title}&lt;/span&gt;&lt;span class=&quot;wordle-wire-top-actions&quot;&gt;${resolvedExit?`&lt;button class=&quot;wordle-wire-action secondary wire-mode-exit&quot; type=&quot;button&quot;&gt;${resolvedExit}&lt;/button&gt;`:&#x27;&#x27;}&lt;button class=&quot;wordle-wire-action secondary wordle-wire-mobile-menu&quot; type=&quot;button&quot; aria-label=&quot;Open menu&quot;&gt;☰&lt;/button&gt;&lt;/span&gt;&lt;/div&gt;`
          : `&lt;div class=&quot;wordle-wire-top&quot;&gt;&lt;span class=&quot;wordle-wire-logo&quot;&gt;WORDLE&lt;/span&gt;&lt;span class=&quot;wordle-wire-muted wordle-wire-auth-label&quot;&gt;${title}&lt;/span&gt;&lt;/div&gt;`;
      };
      const side = (active) =&gt; `&lt;aside class=&quot;wordle-wire-side&quot;&gt;&lt;div class=&quot;wordle-wire-nav-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Yuri&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;@yuri&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wordle-wire-nav-links&quot;&gt;${[&#x27;Home&#x27;,&#x27;Profile&#x27;,&#x27;Friends&#x27;,&#x27;Settings&#x27;].map(item =&gt; `&lt;div class=&quot;wordle-wire-nav-link ${item.toLowerCase()===active?&#x27;is-active&#x27;:&#x27;&#x27;}&quot;&gt;${item}&lt;/div&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/aside&gt;`;
      const shell = (content, active=&#x27;home&#x27;, invite=true) =&gt; `&lt;div class=&quot;wordle-wire-shell&quot;&gt;&lt;main class=&quot;wordle-wire-main&quot;&gt;${content}&lt;/main&gt;${side(active)}&lt;/div&gt;${invite?&#x27;&lt;button id=&quot;wire-invite-bubble&quot; class=&quot;wordle-wire-invite&quot; type=&quot;button&quot; aria-label=&quot;Two battle invitations&quot;&gt;2&lt;/button&gt;&lt;div id=&quot;wire-invitation-panel&quot; class=&quot;wordle-wire-invitation-panel wordle-wire-hidden&quot;&gt;&lt;div class=&quot;wordle-wire-invitation-card&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Mika&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;@mika · 3/8 players&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wordle-wire-invitation-actions&quot;&gt;&lt;button class=&quot;wordle-wire-action wire-accept-invitation&quot; type=&quot;button&quot; aria-label=&quot;Accept Mika’s invitation&quot;&gt;✓&lt;/button&gt;&lt;button class=&quot;wordle-wire-action secondary wire-decline-invitation&quot; type=&quot;button&quot; aria-label=&quot;Decline Mika’s invitation&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;wordle-wire-invitation-card&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;Ari&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;@ari · 2/5 players&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wordle-wire-invitation-actions&quot;&gt;&lt;button class=&quot;wordle-wire-action wire-accept-invitation&quot; type=&quot;button&quot; aria-label=&quot;Accept Ari’s invitation&quot;&gt;✓&lt;/button&gt;&lt;button class=&quot;wordle-wire-action secondary wire-decline-invitation&quot; type=&quot;button&quot; aria-label=&quot;Decline Ari’s invitation&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;}`;
      const board = () =&gt; `&lt;div class=&quot;wordle-wire-board&quot;&gt;${Array.from({length:30},(_,i)=&gt;`&lt;span class=&quot;wordle-wire-tile ${i&lt;10?&#x27;filled&#x27;:&#x27;&#x27;}&quot;&gt;${i&lt;5?&#x27;A&#x27;:&#x27;&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
      const completedBoard = () =&gt; `&lt;div class=&quot;wordle-wire-board wordle-wire-result-board&quot; role=&quot;img&quot; aria-label=&quot;Completed Wordle board: four used rows and two unused rows&quot;&gt;${&#x27;CRANESTOILMIGHTBRAVE&#x27;.padEnd(30,&#x27;&#x27;).split(&#x27;&#x27;).map((letter,i)=&gt;`&lt;span class=&quot;wordle-wire-tile ${i&lt;20?&#x27;filled&#x27;:&#x27;unused&#x27;}&quot;&gt;${i&lt;20?letter:&#x27;&#x27;}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`;
      const keyboard = () =&gt; `&lt;div class=&quot;wordle-wire-keyboard&quot;&gt;&lt;div class=&quot;wordle-wire-keyrow&quot;&gt;${Array.from({length:10},()=&gt;&#x27;&lt;span class=&quot;wordle-wire-key&quot;&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;wordle-wire-keyrow&quot;&gt;${Array.from({length:9},()=&gt;&#x27;&lt;span class=&quot;wordle-wire-key&quot;&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;wordle-wire-keyrow&quot;&gt;&lt;span class=&quot;wordle-wire-key wide&quot;&gt;ENTER&lt;/span&gt;${Array.from({length:7},()=&gt;&#x27;&lt;span class=&quot;wordle-wire-key&quot;&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;span class=&quot;wordle-wire-key wide&quot;&gt;ERASE&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
      const personRow = (name, status, action=&#x27;&#x27;) =&gt; `&lt;div class=&quot;wordle-wire-row&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${status}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;${action?`&lt;button class=&quot;wordle-wire-action secondary&quot; type=&quot;button&quot;&gt;${action}&lt;/button&gt;`:&#x27;&#x27;}&lt;/div&gt;`;
      const friendRow = (name, handle, online) =&gt; `&lt;div class=&quot;wordle-wire-row&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${handle}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${online}&lt;/span&gt;&lt;/div&gt;`;
      const friendTabs = (active) =&gt; `&lt;div class=&quot;wordle-wire-tabs&quot;&gt;&lt;button class=&quot;wordle-wire-tab ${active===&#x27;friends&#x27;?&#x27;is-active&#x27;:&#x27;&#x27;} wordle-wire-friends-tab&quot; data-screen=&quot;friends&quot; type=&quot;button&quot; aria-label=&quot;Friends&quot;&gt;●●&lt;/button&gt;&lt;button class=&quot;wordle-wire-tab ${active===&#x27;friend-requests&#x27;?&#x27;is-active&#x27;:&#x27;&#x27;} wordle-wire-friends-tab&quot; data-screen=&quot;friend-requests&quot; type=&quot;button&quot; aria-label=&quot;Friend requests&quot;&gt;●＋ · 3&lt;/button&gt;&lt;button class=&quot;wordle-wire-tab ${active===&#x27;find-friends&#x27;?&#x27;is-active&#x27;:&#x27;&#x27;} wordle-wire-friends-tab&quot; data-screen=&quot;find-friends&quot; type=&quot;button&quot; aria-label=&quot;Find friends&quot;&gt;⌕&lt;/button&gt;&lt;/div&gt;`;
      const requestRow = (name, handle) =&gt; `&lt;div class=&quot;wordle-wire-row wordle-wire-request-row&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${handle}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wordle-wire-request-actions&quot;&gt;&lt;button class=&quot;wordle-wire-action wordle-wire-icon-action wire-accept-request&quot; type=&quot;button&quot; aria-label=&quot;Accept ${name}&#x27;s friend request&quot;&gt;✓&lt;/button&gt;&lt;button class=&quot;wordle-wire-action secondary wordle-wire-icon-action wire-decline-request&quot; type=&quot;button&quot; aria-label=&quot;Decline ${name}&#x27;s friend request&quot;&gt;×&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;`;
      const findRow = (name, display, relation) =&gt; `&lt;div class=&quot;wordle-wire-row wordle-wire-find-row&quot; data-username=&quot;${name.toLowerCase()}&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${display}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;button class=&quot;wordle-wire-action ${relation===&#x27;Add Friend&#x27;?&#x27;&#x27;:&#x27;secondary&#x27;} wire-relationship-action&quot; type=&quot;button&quot;&gt;${relation}&lt;/button&gt;&lt;/div&gt;`;
      const rankPlayer = (name, details, value, you=false) =&gt; `&lt;button class=&quot;wordle-wire-rank-player&quot; type=&quot;button&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}${you?&#x27; · YOU&#x27;:&#x27;&#x27;}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${details}&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;wordle-wire-rank-value&quot;&gt;${value}&lt;/span&gt;&lt;/button&gt;`;
      const rankGroup = (rank, players, extraClass=&#x27;&#x27;) =&gt; `&lt;div class=&quot;wordle-wire-rank-group ${extraClass}&quot;&gt;&lt;div class=&quot;wordle-wire-rank-number&quot;&gt;#${rank}&lt;/div&gt;&lt;div class=&quot;wordle-wire-rank-players&quot;&gt;${players}&lt;/div&gt;&lt;/div&gt;`;
      const lobbyRow = (name, status, contextual=false) =&gt; `&lt;div class=&quot;wordle-wire-row ${contextual?&#x27;wordle-wire-lobby-player&#x27;:&#x27;&#x27;}&quot;&gt;&lt;div class=&quot;wordle-wire-person&quot;&gt;&lt;span class=&quot;wordle-wire-avatar&quot;&gt;&lt;/span&gt;&lt;span&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;wordle-wire-muted&quot;&gt;${status}&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;`;
      const mini = (name) =&gt; `&lt;div class=&quot;wordle-wire-mini&quot;&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;div class=&quot;wordle-wire-mini-grid&quot;&gt;${Array.from({length:30},()=&gt;&#x27;&lt;span&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
      const audienceHeading = (title, audience=&#x27;Public&#x27;) =&gt; `&lt;div class=&quot;wordle-wire-audience-heading&quot;&gt;&lt;h3&gt;${title}&lt;/h3&gt;&lt;span class=&quot;wordle-wire-audience-wrap&quot;&gt;&lt;button class=&quot;wordle-wire-action secondary wordle-wire-tiny-action wire-audience-button&quot; type=&quot;button&quot; aria-label=&quot;${title} visibility: ${audience}&quot;&gt;${audience===&#x27;Public&#x27;?&#x27;◎&#x27;:audience===&#x27;Friends&#x27;?&#x27;●●&#x27;:&#x27;▣&#x27;}&lt;/button&gt;&lt;span class=&quot;wordle-wire-context-menu wordle-wire-audience-menu wordle-wire-hidden&quot;&gt;&lt;button type=&quot;button&quot; data-audience=&quot;Public&quot;&gt;◎ Public&lt;/button&gt;&lt;button type=&quot;button&quot; data-audience=&quot;Friends&quot;&gt;●● Friends&lt;/button&gt;&lt;button type=&quot;button&quot; data-audience=&quot;Private&quot;&gt;▣ Private&lt;/button&gt;&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;`;
