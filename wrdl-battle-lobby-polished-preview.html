.form-range::-moz-range-track {

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wrdl-battle-lobby-polished&#x27;);
      const stage = root.querySelector(&#x27;#wrdl-battle-lobby-stage&#x27;);
      const showView = (name) =&gt; {
        root.querySelectorAll(&#x27;[data-panel]&#x27;).forEach(panel =&gt; { panel.hidden = panel.dataset.panel !== name; });
        root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-selected&#x27;, button.dataset.view === name));
        root.querySelector(&#x27;[data-invite-picker]&#x27;).hidden = true;
        root.querySelector(&#x27;[data-context-menu]&#x27;).hidden = true;
        if (name === &#x27;countdown&#x27;) runCountdown();
      };
      let countdownTimer;
      const runCountdown = () =&gt; {
        window.clearInterval(countdownTimer);
        const number = root.querySelector(&#x27;[data-countdown-number]&#x27;);
        let value = 3;
        number.textContent = String(value);
        countdownTimer = window.setInterval(() =&gt; {
          value -= 1;
          number.textContent = value &gt; 0 ? String(value) : &#x27;GO&#x27;;
          if (value &lt;= 0) window.clearInterval(countdownTimer);
        }, 760);
      };

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
