  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wrdl-solo-polished&#x27;);
      const stage = root.querySelector(&#x27;#wrdl-solo-stage&#x27;);
      const gameRows = [
        { word: &#x27;CRANE&#x27;, states: [&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;ST&#x27;, states: [&#x27;filled&#x27;,&#x27;filled&#x27;,&#x27;active&#x27;,&#x27;&#x27;,&#x27;&#x27;] }
      ];
      const winRows = [
        { word: &#x27;CRANE&#x27;, states: [&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;SPOIL&#x27;, states: [&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;BLUNT&#x27;, states: [&#x27;present&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;PLANT&#x27;, states: [&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;,&#x27;correct&#x27;] }
      ];
      const failRows = [
        { word: &#x27;CRANE&#x27;, states: [&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;SPOIL&#x27;, states: [&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;BLUNT&#x27;, states: [&#x27;present&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;WATER&#x27;, states: [&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;SHOCK&#x27;, states: [&#x27;absent&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;,&#x27;absent&#x27;] },
        { word: &#x27;GLOVE&#x27;, states: [&#x27;absent&#x27;,&#x27;correct&#x27;,&#x27;absent&#x27;,&#x27;present&#x27;,&#x27;absent&#x27;] }
      ];
      let resultMode = &#x27;win&#x27;;
      let copyTimer;

      function renderBoard(board, rows) {
        const tiles = [];
        for (let rowIndex = 0; rowIndex &lt; 6; rowIndex += 1) {
          const row = rows[rowIndex] || { word: &#x27;&#x27;, states: [] };
          for (let column = 0; column &lt; 5; column += 1) {
            const letter = row.word[column] || &#x27;&#x27;;
            const state = row.states[column] || &#x27;&#x27;;
            tiles.push(`&lt;span class=&quot;wrdl-tile ${state}&quot;&gt;${letter}&lt;/span&gt;`);
          }
        }
        board.innerHTML = tiles.join(&#x27;&#x27;);
      }

      function renderResults() {
        root.querySelectorAll(&#x27;[data-board=&quot;result&quot;]&#x27;).forEach(board =&gt; renderBoard(board, resultMode === &#x27;win&#x27; ? winRows : failRows));
        root.querySelectorAll(&#x27;[data-result-title]&#x27;).forEach(item =&gt; { item.textContent = resultMode === &#x27;win&#x27; ? &#x27;You got it!&#x27; : &#x27;Failed&#x27;; });
        root.querySelectorAll(&#x27;[data-result-score]&#x27;).forEach(item =&gt; { item.textContent = resultMode === &#x27;win&#x27; ? &#x27;4/6&#x27; : &#x27;X/6&#x27;; });
        root.querySelectorAll(&#x27;[data-result-icon]&#x27;).forEach(item =&gt; {
          item.textContent = resultMode === &#x27;win&#x27; ? &#x27;✓&#x27; : &#x27;×&#x27;;
          item.classList.toggle(&#x27;is-fail&#x27;, resultMode !== &#x27;win&#x27;);
        });
        const streakLabel = root.querySelector(&#x27;[data-streak-label]&#x27;);
        const streakValue = root.querySelector(&#x27;[data-streak-value]&#x27;);
        streakLabel.textContent = resultMode === &#x27;win&#x27; ? &#x27;Current streak&#x27; : &#x27;Updated streak&#x27;;
        streakValue.textContent = resultMode === &#x27;win&#x27; ? &#x27;12 days&#x27; : &#x27;0 days&#x27;;
      }

      function keyboardMarkup() {
        const rows = [[&#x27;Q&#x27;,&#x27;W&#x27;,&#x27;E&#x27;,&#x27;R&#x27;,&#x27;T&#x27;,&#x27;Y&#x27;,&#x27;U&#x27;,&#x27;I&#x27;,&#x27;O&#x27;,&#x27;P&#x27;],[&#x27;A&#x27;,&#x27;S&#x27;,&#x27;D&#x27;,&#x27;F&#x27;,&#x27;G&#x27;,&#x27;H&#x27;,&#x27;J&#x27;,&#x27;K&#x27;,&#x27;L&#x27;],[&#x27;ENTER&#x27;,&#x27;Z&#x27;,&#x27;X&#x27;,&#x27;C&#x27;,&#x27;V&#x27;,&#x27;B&#x27;,&#x27;N&#x27;,&#x27;M&#x27;,&#x27;⌫&#x27;]];
        const states = { E:&#x27;absent&#x27;, R:&#x27;present&#x27;, A:&#x27;absent&#x27;, C:&#x27;absent&#x27;, N:&#x27;correct&#x27; };
        return rows.map(row =&gt; `&lt;div class=&quot;wrdl-key-row&quot;&gt;${row.map(key =&gt; `&lt;button class=&quot;wrdl-key ${(key === &#x27;ENTER&#x27; || key === &#x27;⌫&#x27;) ? &#x27;wide&#x27; : &#x27;&#x27;} ${states[key] || &#x27;&#x27;}&quot; type=&quot;button&quot; aria-label=&quot;${key === &#x27;⌫&#x27; ? &#x27;Erase&#x27; : key}&quot;&gt;${key}&lt;/button&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      root.querySelectorAll(&#x27;[data-board=&quot;game&quot;]&#x27;).forEach(board =&gt; renderBoard(board, gameRows));
      root.querySelectorAll(&#x27;[data-keyboard]&#x27;).forEach(keyboard =&gt; { keyboard.innerHTML = keyboardMarkup(); });
      renderResults();

      root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
        root.querySelectorAll(&#x27;[data-screen-panel]&#x27;).forEach(panel =&gt; { panel.hidden = panel.dataset.screenPanel !== button.dataset.screen; });
      }));
      root.querySelectorAll(&#x27;[data-result]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        resultMode = button.dataset.result;
        root.querySelectorAll(&#x27;[data-result]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
        renderResults();
      }));
      root.querySelectorAll(&#x27;[data-viewport]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        stage.classList.toggle(&#x27;is-mobile&#x27;, button.dataset.viewport === &#x27;mobile&#x27;);
        root.querySelectorAll(&#x27;[data-viewport]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
      }));
      root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        root.classList.toggle(&#x27;is-dark&#x27;, button.dataset.theme === &#x27;dark&#x27;);
        root.querySelectorAll(&#x27;[data-theme]&#x27;).forEach(item =&gt; item.classList.toggle(&#x27;is-selected&#x27;, item === button));
      }));
      root.querySelectorAll(&#x27;.wrdl-pool&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        button.classList.toggle(&#x27;is-selected&#x27;);
        button.setAttribute(&#x27;aria-pressed&#x27;, String(button.classList.contains(&#x27;is-selected&#x27;)));
        root.querySelector(&#x27;#wrdl-start-free&#x27;).disabled = root.querySelectorAll(&#x27;.wrdl-pool.is-selected&#x27;).length === 0;
      }));
      root.querySelectorAll(&#x27;[data-share-results]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
        const confirmation = button.closest(&#x27;.wrdl-screen&#x27;).querySelector(&#x27;.wrdl-copy-confirm&#x27;);
        clearTimeout(copyTimer);
        confirmation.classList.add(&#x27;is-visible&#x27;);
        copyTimer = setTimeout(() =&gt; confirmation.classList.remove(&#x27;is-visible&#x27;), 1800);
      }));
    })();
  &lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
