}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;

}

.btn:focus-visible {

  outline-offset: 2px;
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;wrdl-social-profile-polished&#x27;);
      const stage = root.querySelector(&#x27;#wrdl-social-stage&#x27;);
      const titles = { friends: &#x27;Friends&#x27;, requests: &#x27;Friends&#x27;, find: &#x27;Friends&#x27;, &#x27;my-profile&#x27;: &#x27;Profile&#x27;, &#x27;friend-profile&#x27;: &#x27;Profile&#x27; };
      const miniTiles = Array.from({ length: 30 }, () =&gt; &#x27;&lt;span&gt;&lt;/span&gt;&#x27;).join(&#x27;&#x27;);
      const dailyCards = [&#x27;Today&#x27;, &#x27;Yesterday&#x27;, &#x27;2 days ago&#x27;].map((label, index) =&gt; `&lt;article class=&quot;wrdl-daily-card&quot;&gt;&lt;div class=&quot;wrdl-daily-top&quot;&gt;&lt;strong&gt;${label}&lt;/strong&gt;&lt;span&gt;${index === 0 ? &#x27;4/6&#x27; : index === 1 ? &#x27;3/6&#x27; : &#x27;5/6&#x27;}&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wrdl-mini-grid&quot; aria-label=&quot;Spoiler-free Wordle result&quot;&gt;${miniTiles}&lt;/div&gt;&lt;/article&gt;`).join(&#x27;&#x27;);

      root.querySelectorAll(&#x27;[data-carousel]&#x27;).forEach(carousel =&gt; { carousel.innerHTML = dailyCards; });

      function streakHue(days) {
        const stops = [{ day: 1, hue: 4 }, { day: 20, hue: 30 }, { day: 40, hue: 52 }, { day: 60, hue: 130 }, { day: 80, hue: 215 }, { day: 100, hue: 275 }];
        const capped = Math.max(1, Math.min(100, days));
        const upperIndex = stops.findIndex(stop =&gt; capped &lt;= stop.day);
        if (upperIndex &lt;= 0) return stops[0].hue;
        const lower = stops[upperIndex - 1];
        const upper = stops[upperIndex];
        const progress = (capped - lower.day) / (upper.day - lower.day);
        return lower.hue + ((upper.hue - lower.hue) * progress);
      }

      function renderStreaks() {
        const lightness = root.classList.contains(&#x27;is-dark&#x27;) ? 68 : 42;
        root.querySelectorAll(&#x27;[data-streak-days]&#x27;).forEach(card =&gt; {
          const days = Number(card.dataset.streakDays);
          card.style.setProperty(&#x27;--wrdl-streak-color&#x27;, days &gt; 0 ? `hsl(${streakHue(days)} 68% ${lightness}%)` : &#x27;var(--wrdl-muted)&#x27;);
          card.querySelector(&#x27;[data-streak-flame]&#x27;).hidden = days &lt; 1;
          card.querySelector(&#x27;[data-streak-label]&#x27;).textContent = `${days} ${days === 1 ? &#x27;day&#x27; : &#x27;day&#x27;} streak`;
        });
      }

      renderStreaks();

      function showScreen(name) {
        root.querySelectorAll(&#x27;[data-screen-panel]&#x27;).forEach(panel =&gt; { panel.hidden = panel.dataset.screenPanel !== name; });
        root.querySelectorAll(&#x27;[data-screen]&#x27;).forEach(button =&gt; button.classList.toggle(&#x27;is-selected&#x27;, button.dataset.screen === name));
        root.querySelector(&#x27;[data-mobile-title]&#x27;).textContent = titles[name];

    target?.nodeType != null &amp;&amp; trigger.contains(target);

    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);

      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
